# NEJ-RS

# 1. Name
name: Build Workflow 

# 2. Event 
on: 
  push:
    branches: [main]

# 3. Job
jobs:
  build: # 4. Runner
    runs-on: ubuntu-latest

  # 5. Steps 
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v6.0.2

      - name: Set up Python  
        uses: actions/setup-python@v6.2.0

      - name: Install Dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test 
        run: pytest
        # pytest file_one.py, file_two.py
      
